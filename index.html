<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0714">
<title>Rabiya ❤️ Ömer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:white;
    background:#0b0611;
}

/* PREMIUM ARKA PLAN */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%, #32132d 0%, #160b20 35%, #09050e 75%);
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:.45;
    animation:moveOrb 10s ease-in-out infinite alternate;
}

.orb1{
    width:320px;
    height:320px;
    background:#ff267f;
    top:-120px;
    left:-100px;
}

.orb2{
    width:360px;
    height:360px;
    background:#7b35ff;
    right:-140px;
    bottom:-130px;
    animation-delay:2s;
}

.orb3{
    width:230px;
    height:230px;
    background:#ff4fba;
    left:35%;
    top:35%;
    opacity:.16;
    animation-delay:4s;
}

@keyframes moveOrb{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(60px,-40px) scale(1.15);
    }
}

/* YILDIZLAR */

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.4);
    }
}

/* ANA */

main{
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* CAM KART */

.card{
    width:min(92vw,500px);
    padding:42px 28px;
    text-align:center;
    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.18);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    animation:cardIn 1s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.94);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* KALP */

.heart{
    font-size:75px;
    display:inline-block;
    filter:
        drop-shadow(0 0 12px #ff3b8d)
        drop-shadow(0 0 35px rgba(255,60,150,.5));

    animation:heartbeat 1.35s infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.18);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.1);
    }
}

.title{
    margin-top:18px;
    font-size:clamp(34px,9vw,50px);
    font-weight:800;

    background:
        linear-gradient(
            90deg,
            #ff70ad,
            #fff,
            #e1a5ff,
            #ff70ad
        );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:gradientMove 5s linear infinite;
}

@keyframes gradientMove{
    to{
        background-position:300%;
    }
}

.question{
    margin-top:20px;
    font-size:18px;
    line-height:1.7;
    color:#ffe9f3;
}

.question strong{
    font-size:21px;
}

/* BUTONLAR */

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
    min-height:55px;
}

button{
    border:none;
    border-radius:50px;
    padding:15px 31px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}

#yes{
    color:white;
    background:
        linear-gradient(135deg,#ff2f82,#ff6baa);

    box-shadow:
        0 10px 30px rgba(255,47,130,.4);
}

#yes:hover{
    transform:scale(1.08);
    box-shadow:
        0 15px 40px rgba(255,47,130,.55);
}

#no{
    color:white;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16);
}

/* ALT YAZI */

.hint{
    margin-top:25px;
    color:rgba(255,255,255,.42);
    font-size:12px;
}

/* SONUÇ */

#success{
    display:none;
}

.successHeart{
    font-size:70px;
    animation:heartbeat 1.2s infinite;
}

.names{
    margin-top:12px;
    font-size:clamp(34px,9vw,52px);
    font-weight:850;

    background:
        linear-gradient(
            90deg,
            #ff74ae,
            white,
            #d5a1ff
        );

    -webkit-background-clip:text;
    color:transparent;
}

.date{
    margin-top:9px;
    font-size:12px;
    letter-spacing:3px;
    color:rgba(255,255,255,.48);
}

.message{
    margin-top:24px;
    font-size:16px;
    line-height:1.8;
    color:#ffeaf3;
}

.shortLove{
    margin-top:23px;
    padding:15px 18px;
    border-radius:18px;

    background:rgba(255,105,170,.09);
    border:1px solid rgba(255,130,190,.18);

    color:#ffb8d7;
    font-size:15px;

    animation:softGlow 2.5s infinite alternate;
}

@keyframes softGlow{
    from{
        box-shadow:0 0 0 rgba(255,70,150,0);
    }

    to{
        box-shadow:0 0 25px rgba(255,70,150,.18);
    }
}

/* ÇİÇEKLER */

.particle{
    position:fixed;
    top:-70px;
    z-index:20;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    0%{
        transform:translateY(-70px) rotate(0);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* MOBİL */

@media(max-width:420px){

    .card{
        padding:36px 20px;
    }

    .heart{
        font-size:63px;
    }

    .question{
        font-size:16px;
    }

    button{
        padding:14px 25px;
    }
}
</style>
</head>

<body>

<div class="background">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="stars" id="stars"></div>

</div>


<main>

    <!-- İLK EKRAN -->

    <section class="card" id="question">

        <div class="heart">
            ❤️
        </div>

        <div class="title">
            Rabiya
        </div>

        <div class="question">

            Sana söylemek istediğim
            güzel bir şey var... 💌

            <br><br>

            <strong>
                Benimle çıkar mısın?
            </strong>

        </div>

        <div class="buttons">

            <button id="yes">
                Evet ❤️
            </button>

            <button id="no">
                Hayır 🙈
            </button>

        </div>

        <div class="hint">
            Kalbim cevabı çoktan verdi. 🌹
        </div>

    </section>


    <!-- EVET SONRASI -->

    <section class="card" id="success">

        <div class="successHeart">
            💖
        </div>

        <div class="names">
            Rabiya ❤️ Ömer
        </div>

        <div class="date">
            18 EYLÜL 2026
        </div>

        <div class="message">

            O zaman güzel bir hikâyenin
            ilk sayfasını birlikte açtık. 🌹

        </div>

        <div class="shortLove">

            “İyi ki Evet dedin, Rabiya. ❤️”

        </div>

    </section>

</main>


<script>

const yes = document.getElementById("yes");
const no = document.getElementById("no");

const question = document.getElementById("question");
const success = document.getElementById("success");

const stars = document.getElementById("stars");


// YILDIZLAR

for(let i=0;i<75;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=
        Math.random()*100+"vw";

    star.style.top=
        Math.random()*100+"vh";

    star.style.animationDelay=
        Math.random()*3+"s";

    stars.appendChild(star);
}


// HAYIR BUTONU

function escapeNo(){

    const maxX =
        window.innerWidth-no.offsetWidth-15;

    const maxY =
        window.innerHeight-no.offsetHeight-15;

    no.style.position="fixed";

    no.style.left=
        Math.max(10,Math.random()*maxX)+"px";

    no.style.top=
        Math.max(10,Math.random()*maxY)+"px";
}

no.addEventListener(
    "mouseenter",
    escapeNo
);

no.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        escapeNo();

    }
);


// EVET

yes.addEventListener(
    "click",
    function(){

        question.style.display="none";

        success.style.display="block";

        createLoveRain();

    }
);


// ÇİÇEK + KALP YAĞMURU

function createLoveRain(){

    const items=[
        "🌹",
        "🌸",
        "🌷",
        "🌺",
        "🌻",
        "💐",
        "❤️",
        "💖",
        "💕",
        "✨"
    ];

    for(let i=0;i<120;i++){

        const p=
            document.createElement("div");

        p.className="particle";

        p.textContent=
            items[
                Math.floor(
                    Math.random()*items.length
                )
            ];

        p.style.left=
            Math.random()*100+"vw";

        p.style.fontSize=
            (16+Math.random()*30)+"px";

        p.style.animationDuration=
            (3+Math.random()*4)+"s";

        p.style.animationDelay=
            Math.random()*1.5+"s";

        document.body.appendChild(p);

        setTimeout(
            ()=>p.remove(),
            8000
        );
    }
}

</script>

</body>
</html>
